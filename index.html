<style>
:root{
  --green:#2e3b22; --green-d:#222b18; --green-l:#3c4d2c;
  --gold:#c79a3f; --gold-d:#a8812f;
  --cream:#f3eee2; --paper:#ffffff; --panel:#faf6ec;
  --txt:#26301c; --muted:#6f6a58; --soft:#8a8470;
  --line:#e4ddcc; --line2:#d7cfb9;
  --accent:#2e3b22; --accent-d:#222b18; --accent2:#c79a3f;
  --warn:#b8862a; --danger:#b23b2e; --gold2:#c79a3f;
  --disp:'Graduate','Oswald',sans-serif;
  --poster:'Graduate','Anton',sans-serif;
  --shadow:0 1px 2px rgba(34,28,12,.06),0 2px 8px rgba(34,28,12,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--txt);font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:82px;-webkit-font-smoothing:antialiased}
a{color:var(--gold-d)}
.app{max-width:640px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:var(--green);box-shadow:0 4px 0 var(--gold);padding:15px 18px;display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px}
.brand-ico{color:var(--cream);display:flex;align-items:center}
.wordmark{font-family:var(--poster);font-weight:400;font-size:26px;letter-spacing:2px;color:var(--cream);text-transform:uppercase;line-height:1}
.wordmark em{font-style:normal;color:var(--gold);font-weight:400;margin-left:6px}
.hdate{font-size:11px;color:rgba(243,238,226,.6);text-align:right;text-transform:uppercase;letter-spacing:1px;font-weight:600}
h2.view-title{font-family:var(--poster);font-size:40px;letter-spacing:.5px;text-transform:uppercase;margin:24px 0 16px;font-weight:400;color:var(--green);position:relative;padding-bottom:12px}
h2.view-title::after{content:"";position:absolute;left:0;bottom:0;width:58px;height:5px;background:var(--gold);border-radius:3px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.card{background:var(--paper);border:1px solid var(--line2);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 14px rgba(34,28,12,.07)}
.card h3{margin:0 0 14px;font-family:var(--disp);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--green);display:flex;align-items:center;gap:8px}
.row{display:flex;gap:12px}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#progBody > .grid2,#progBody > .grid3{margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:8px;padding:16px 12px 14px;text-align:center}
.stat .v{font-family:var(--poster);font-size:32px;font-weight:400;letter-spacing:.5px;color:var(--green)}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
.stat .v small{font-size:13px;color:var(--soft);font-weight:600}
.btn{background:var(--green);color:var(--cream);border:1px solid var(--green-d);border-radius:8px;padding:12px 18px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{background:var(--green-d)}
.btn:active{transform:translateY(1px)}
.btn.full{width:100%}
.btn.ghost{background:var(--paper);color:var(--green);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--panel)}
.btn.blue{background:var(--gold-d);border-color:#937128;color:#fff}
.btn.blue:hover{background:#937128}
.btn.sm{padding:9px 14px;font-size:13px}
.btn.danger{background:var(--paper);color:var(--danger);border:1px solid #d8b3ac}
.btn.danger:hover{background:#f6e7e4}
input,select,textarea{background:var(--paper);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:11px 12px;font-size:15px;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(46,59,34,.12)}
label.fl{font-size:12px;color:var(--muted);display:block;margin:0 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:12.5px;color:var(--muted);font-weight:600}
.pill.on{background:rgba(46,59,34,.1);border-color:rgba(46,59,34,.35);color:var(--green)}
.tag{font-size:10.5px;padding:3px 9px;border-radius:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tag.gym{background:rgba(46,59,34,.13);color:var(--green)}
.tag.soccer{background:rgba(199,154,63,.18);color:var(--gold-d)}
.tag.rest{background:#ece6d8;color:var(--muted)}
.daycard{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:10px;cursor:pointer;transition:.12s}
.daycard:hover{border-color:var(--line2);background:var(--panel)}
.daycard.today{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.daycard.done{background:rgba(46,59,34,.08);border-color:var(--green)}
.daycard .dd{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.daycard .dn{flex:1;min-width:0}
.daycard .dn b{font-family:var(--disp);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.daycard .dn span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;flex-shrink:0;font-size:13px}
.chk.done{background:var(--green);border-color:var(--green);color:var(--cream)}
.ex{border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px;background:var(--paper)}
.ex .exh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ex .exh b{font-size:15px}
.ex .exh .target{font-size:12px;color:var(--muted)}
.exh-main{display:flex;align-items:center;gap:12px;cursor:pointer;flex:1;min-width:0}
.exthumb{width:64px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid var(--line);background:#e7e0cf}
.exthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vfill{width:100%;height:100%;min-height:44px;background:#e4ddcc;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vfill img{width:100%;height:100%;object-fit:cover;display:block}
.vplay{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;padding-left:2px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tips{margin:6px 0 0;padding-left:18px;font-size:14.5px;line-height:1.55}
.tips li{margin-bottom:8px}
.exlib{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.exlib .item{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--paper);cursor:pointer;transition:.12s}
.exlib .item:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.exlib .item .cap{padding:10px 11px;font-size:13px;font-weight:700;line-height:1.3}
.exlib .item .cap small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .sn{font-family:var(--disp);font-size:14px;color:var(--gold-d);text-align:center;font-weight:600}
.setrow input{padding:9px;text-align:center}
.setrow .rm{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.miniadd{background:none;border:1px dashed var(--line2);color:var(--muted);border-radius:8px;padding:8px;width:100%;font-size:13px;cursor:pointer;font-weight:600}
.miniadd:hover{background:var(--panel)}
.foodrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.foodrow:last-child{border-bottom:none}
.foodrow .fn{flex:1;min-width:0}
.foodrow .fn b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foodrow .fn span{font-size:12px;color:var(--muted)}
.foodrow .fc{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--green)}
.bar{height:10px;background:#e7e0cf;border-radius:999px;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;border-radius:999px}
.macro{margin-bottom:12px}
.macro .ml{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.macro .ml b{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--green);border-top:3px solid var(--gold);display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.nav button{background:none;border:none;color:rgba(243,238,226,.6);font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 14px;border-radius:8px;flex:1;transition:.12s}
.nav button.on{color:var(--green);background:var(--gold)}
.nav button .ic{display:grid;place-items:center;height:23px}
.hidden{display:none!important}
.modal-bg{position:fixed;inset:0;background:rgba(26,22,10,.5);z-index:50;display:grid;place-items:flex-end;backdrop-filter:blur(2px)}
.modal{background:var(--paper);border-top:4px solid var(--gold);border-top-left-radius:16px;border-top-right-radius:16px;width:100%;max-width:640px;margin:0 auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;box-shadow:0 -10px 34px rgba(0,0,0,.18)}
.modal h3{margin:0 0 16px;font-family:var(--disp);font-size:21px;text-transform:uppercase;letter-spacing:1px;color:var(--green)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.x{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:8px;font-size:16px;cursor:pointer}
canvas{max-width:100%}
.seg{display:flex;background:var(--panel);border-radius:9px;padding:3px;border:1px solid var(--line);margin-bottom:16px}
.seg button{flex:1;background:none;border:none;color:var(--muted);padding:9px;border-radius:7px;font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
.seg button.on{background:var(--green);color:var(--cream)}
.kpi{display:flex;align-items:baseline;gap:6px}
.kpi b{font-family:var(--poster);font-size:36px;font-weight:400;color:var(--green)}
.kpi span{font-size:14px;color:var(--muted)}
.flash{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--cream);padding:11px 18px;border-radius:8px;font-family:var(--disp);font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-size:13px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25);border:1px solid var(--gold);animation:fade 2.2s forwards}
@keyframes fade{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
.ringwrap{position:relative;width:150px;height:150px;margin:0 auto}
.ringwrap .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .ctr b{font-family:var(--disp);font-size:28px;font-weight:700}
.ringwrap .ctr span{font-size:11px;color:var(--muted);margin-top:2px}
hr.div{border:none;border-top:1px solid var(--line);margin:16px 0}
.note{font-size:13.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:12px 14px;line-height:1.5}
.note b{color:var(--txt)}
.vidposter{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--txt);width:100%;aspect-ratio:16/9;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.vplaybig{width:56px;height:56px;border-radius:50%;background:var(--green);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px;box-shadow:0 4px 12px rgba(46,59,34,.3)}
.vidposter b{font-size:15px;margin-top:6px}
.vidposter small{font-size:11px;color:var(--muted)}
.demo{position:relative;width:100%;aspect-ratio:4/3;background:#e4ddcc;border-radius:12px;overflow:hidden;margin-bottom:10px;border:1px solid var(--line)}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img.b{animation:flipdemo 1.8s ease-in-out infinite}
@keyframes flipdemo{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
.ytlink{display:inline-block;font-size:14px;color:var(--gold-d);text-decoration:none;font-weight:600;margin-bottom:6px}
.syncpill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.syncpill.ok{color:var(--green);border-color:rgba(46,59,34,.4);background:rgba(46,59,34,.1)}
.syncpill.err{color:var(--danger);border-color:#d8b3ac}
.syncpill.wait{color:var(--warn);border-color:#e3cfa0}
.swapbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;border-radius:8px;font-size:16px;cursor:pointer;flex-shrink:0}
.swapbtn:hover{background:var(--paper);color:var(--green);border-color:var(--line2)}
.exhr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.extick{display:none;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:15px;font-weight:800;flex-shrink:0}
.ex.exdone .extick{display:inline-flex}
.ex.exdone{border-color:var(--green);background:rgba(46,59,34,.055)}
.ex.exdone .exh-main b{color:var(--green)}
.daysel{width:auto;max-width:calc(100% - 130px);margin-left:12px;vertical-align:middle;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);color:var(--txt);font-family:inherit}
.daygo{border:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--cream);cursor:pointer;flex-shrink:0}
.daygo:active{transform:scale(.95)}
</style>
</head>

function doSwap(dayIdx, oldN, newN){
  const day=S.routine[dayIdx]; const it=(day.ex||[]).find(e=>e.n===oldN); if(it) it.n=newN;
  save();
  if(session && session.dayIdx===dayIdx){
    const se=(session.exercises||[]).find(e=>e.n===oldN);
    if(se){ se.n=newN; se.sets=se.sets.map(()=>({w:'',r:''})); session.ref&&(session.ref._m=Date.now()); }
    closeModal(); openSessionModal();
  } else { closeModal(); setView(currentView); }
  flash('Ejercicio cambiado ⇄');
}
function rangeTop(t){ const m=String(t).match(/(\d+)\s*-\s*(\d+)/); return m? +m[2] : null; }
function progressReady(ex,target){
  const top=rangeTop(target); if(!top) return false;
  const sets=(ex.sets||[]).filter(s=>s.r!==''&&s.r!=null);
  if(!sets.length) return false;
  return sets.every(s=>(+s.r)>=top && (+s.w)>0);
}
function cycleInfo(){
  const start=S.programStart||S.created||todayStr(); const dw=S.deloadWeeks||7;

  const wk=Math.floor(days/7)+1; const pos=((wk-1)%dw)+1;
  return {wk,dw,pos,deload:pos===dw};
}

function weekStrip(){

    </div>`;
  }
  return html;
}
function goDay(i){ setView('entrenar'); }

function calcStreak(){
  let streak=0; const d=new Date();
  for(let i=0;i<60;i++){
    const ds=d.toISOString().slice(0,10);
    const dow=d.getDay();
    const planned=S.routine[dow].type;
    const did=S.workouts.some(w=>w.date===ds);
    if(planned==='rest'){ if(i===0||streak>0){streak++;} }
    else if(did){ streak++; }
    else { if(i===0){ d.setDate(d.getDate()-1); continue; } break; }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function tplKeyFor(r){ if(!r) return 'rest'; if(r.type==='rest')return 'rest'; if(r.type==='soccer')return 'soccer'; if(r.name===TEMPLATES.r2.name)return 'r2'; if(r.name===TEMPLATES.r3.name)return 'r3'; if(r.name===TEMPLATES.nolegs.name)return 'nolegs'; return 'r1'; }
function rotateExercises(){
  [1,2,3,4,5,6,0].forEach(d=>{ const day=S.routine[d]; if(!day||day.type!=='gym') return;
    const used=new Set(day.ex.map(e=>e.n));
    day.ex.forEach(e=>{
      const pat=PAT[e.n]; if(!pat) return;
      const pool=Object.keys(PAT).filter(n=>PAT[n]===pat && EXVID[n]);
      if(pool.length<2) return;
      const idx=pool.indexOf(e.n);
      for(let k=1;k<=pool.length;k++){ const cand=pool[(idx+k)%pool.length]; if(!used.has(cand)){ used.delete(e.n); used.add(cand); e.n=cand; break; } }
    });
  });
  save(); flash('Ejercicios rotados 🔄'); setView('entrenar');
}

function startWorkout(dayIdx, dateOverride){
  const td = dateOverride || todayStr();
  const r=S.routine[dayIdx];
  if(r.type==='soccer'){
    session={dayIdx, date:td, name:r.name, type:'soccer', exercises:[], soccer:{minutes:60,intensity:'media'}};
  } else {
    let w=S.workouts.find(x=>x.date===td && x.dayIdx===dayIdx && x.type==='gym');
    if(!w){
      const hist=S.workouts.filter(x=>x.type==='gym'&&x.date!==td&&x.exercises).sort((a,b)=>b.date.localeCompare(a.date));
      const lastFor=(name)=>{ for(const ww of hist){ const m=(ww.exercises||[]).find(x=>x.n===name && (x.sets||[]).some(s=>(+s.w||0)>0)); if(m) return m; } return null; };
      w={ id:uid(), date:td, dayIdx, name:r.name, type:'gym', note:'', done:false,
        exercises: r.ex.map(e=>{
          const prev = lastFor(e.n);
          let pw='';
          if(prev && prev.sets && prev.sets.length){
            const w0=Math.max(0,...prev.sets.map(s=>+s.w||0));
            if(w0>0) pw = progressReady(prev, e.r) ? (w0+incFor(e.n)) : w0;
          }
          const nSets = (prev && prev.sets) ? Math.max(1,prev.sets.length) : e.s;
          return { n:e.n, target:e.r, sets: Array.from({length:nSets},()=>({ w:(pw===''?'':String(pw)), r:'' })) };
        }) };
      w._m=Date.now();
      S.workouts.push(w); save();
    }
    session={ dayIdx, date:td, name:r.name, type:'gym', exercises:w.exercises, ref:w };
  }
  openSessionModal();
}

function saveSession(){
  if(session.type==='soccer'){
    const w={ id:uid(), date:session.date||todayStr(), dayIdx:session.dayIdx, name:session.name, type:'soccer', done:true, _m:Date.now(),
      soccer:{ minutes:+($('#scMin').value||0), intensity:$('#scInt').value, goals:+($('#scGoals').value||0), assists:+($('#scAssists').value||0), note:$('#scNote').value }, exercises:[] };
    S.workouts.push(w); save(); closeModal(); session=null; setView(currentView); flash('Partido guardado ⚽'); return;
  }
  const w=session.ref; w.done=true; w._m=Date.now();
  w.exercises.forEach(ex=>{ if(ex.sets.length>1) ex.sets=ex.sets.filter((s,i)=> s.w!==''||s.r!==''||i===0); });
  save();
  const prog=w.exercises.filter(ex=>progressReady(ex, ex.target)).map(ex=>ex.n);
  closeModal(); session=null; setView(currentView);
  if(prog.length){ showModal(`<div class="mhead"><h3>💪 ¡Rutina terminada!</h3><button class="x" onclick="closeModal()">✕</button></div><p class="sub">Completaste el tope del rango acá. <b>La próxima sesión ya te aparece el peso subido automáticamente:</b></p>${prog.map(n=>`<div class="daycard"><div class="exthumb">${exArt(n)}</div><div class="dn"><b>${n}</b><span>+${incFor(n)} kg la próxima ▲</span></div></div>`).join('')}<button class="btn full" style="margin-top:10px" onclick="closeModal()">¡Listo!</button>`); }
  else { flash('¡Rutina terminada! ✅'); }
}

function progPeso(){
  const bw=S.bodyweight.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const last=bw[bw.length-1], first=bw[0];
  const diff = (last&&first)? (last.kg-first.kg):0;
  $('#progBody').innerHTML=`
    <div class="grid3">
      <div class="stat"><div class="v">${last?fmt(last.kg,1):'–'}<small>kg</small></div><div class="l">Actual</div></div>
      <div class="stat"><div class="v" style="color:${diff<0?'var(--accent)':diff>0?'var(--warn)':'inherit'}">${diff>0?'+':''}${fmt(diff,1)}</div><div class="l">Cambio</div></div>
      <div class="stat"><div class="v">${fmt(S.profile.goalWeight,0)}<small>kg</small></div><div class="l">Meta</div></div>
    </div>
    <div class="card"><h3>⚖️ Peso corporal</h3>${bw.length?'<canvas id="cBW" height="200"></canvas>':'<div class="empty">Registra tu peso para ver la gráfica.</div>'}
      <button class="btn full ghost sm" style="margin-top:12px" onclick="openBW()">+ Registrar peso</button></div>`;
  if(bw.length){ lineChart('cBW', bw.map(b=>b.date.slice(5)), [{label:'Peso (kg)', data:bw.map(b=>b.kg), color:'#3c4d2c'}], S.profile.goalWeight); }
}
function progFuerza(){
  const names=[...new Set(S.workouts.filter(w=>w.type==='gym').flatMap(w=>(w.exercises||[]).map(e=>e.n)))];
  if(!names.length){ $('#progBody').innerHTML='<div class="card"><div class="empty">Registra sesiones de gimnasio para ver tu progreso de fuerza.</div></div>'; return; }
  if(!progEx||!names.includes(progEx)) progEx=names[0];
  const pts=[];
  S.workouts.filter(w=>w.type==='gym').sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{
    const ex=(w.exercises||[]).find(e=>e.n===progEx); if(!ex)return;
    const best=Math.max(0,...(ex.sets||[]).map(s=>e1rm(s.w,s.r)));
    if(best>0) pts.push({date:w.date, v:best});
  });
  $('#progBody').innerHTML=`
    <div class="field"><label class="fl">Ejercicio</label><select id="exSel" onchange="progEx=this.value;progFuerza()">${names.map(n=>`<option ${n===progEx?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="card"><h3>🏋️ 1RM estimado · ${progEx}</h3>${pts.length?'<canvas id="cF" height="200"></canvas>':'<div class="empty">Sin datos de este ejercicio todavía.</div>'}
      <p class="note" style="margin-top:12px">El 1RM estimado se calcula con la fórmula de Epley a partir de tu mejor serie de cada día.</p></div>`;
  if(pts.length) lineChart('cF', pts.map(p=>p.date.slice(5)), [{label:'1RM est. (kg)', data:pts.map(p=>Math.round(p.v)), color:'#a8812f'}]);
}

    {label:'Pecho', data:m.map(x=>x.chest||null), color:'#3b82f6'},

function progVolumen(){
  const weeks={};
  S.workouts.filter(w=>w.type==='gym').forEach(w=>{
    const d=new Date(w.date); const onejan=new Date(d.getFullYear(),0,1);
    const wk=d.getFullYear()+'-S'+Math.ceil(((d-onejan)/86400000+onejan.getDay()+1)/7);
    const vol=(w.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((x,s)=>x+(+s.w||0)*(+s.r||0),0),0);
    weeks[wk]=(weeks[wk]||0)+vol;
  });
  const keys=Object.keys(weeks).sort().slice(-8);
  const socW=S.workouts.filter(w=>w.type==='soccer');
  const gym=S.workouts.filter(w=>w.type==='gym').length, soc=socW.length;
  const goals=socW.reduce((a,w)=>a+(w.soccer?.goals||0),0);
  const assists=socW.reduce((a,w)=>a+(w.soccer?.assists||0),0);
  const gpm=soc?(goals/soc):0, contrib=goals+assists;
  $('#progBody').innerHTML=`
    <div class="card"><h3>⚽ Temporada de fútbol</h3>
      <div class="grid3">
        <div class="stat"><div class="v">${goals}</div><div class="l">Goles</div></div>
        <div class="stat"><div class="v">${assists}</div><div class="l">Asistencias</div></div>
        <div class="stat"><div class="v">${soc}</div><div class="l">Partidos</div></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="stat" style="flex:1"><div class="v">${contrib}</div><div class="l">G+A</div></div>
        <div class="stat" style="flex:1"><div class="v">${fmt(gpm,2)}</div><div class="l">Goles/partido</div></div>
      </div>
    </div>
    <div class="grid2">
      <div class="stat"><div class="v">${gym}</div><div class="l">Sesiones gym</div></div>
      <div class="stat"><div class="v">${soc}</div><div class="l">Partidos</div></div>
    </div>
    <div class="card"><h3>📊 Volumen semanal (kg)</h3>${keys.length?'<canvas id="cV" height="200"></canvas>':'<div class="empty">Registra sesiones de gimnasio para ver tu volumen.</div>'}
      <p class="note" style="margin-top:12px">Volumen = Σ (peso × reps) de todas tus series. Subir el volumen poco a poco impulsa el crecimiento muscular.</p></div>`;
  if(keys.length) barChart('cV', keys.map(k=>k.split('-')[1]), keys.map(k=>Math.round(weeks[k])));
}

function ring(pct, val, goal){
  const R=58, Circ=2*Math.PI*R, off=Circ*(1-Math.min(pct,100)/100);
  const col = pct>105?'#ef4444':pct>=90?'#22d3a6':'#3b82f6';
  return `<div class="ringwrap"><svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="#1d2430" stroke-width="12"/>
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${Circ}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"/>
    </svg><div class="ctr"><b>${fmt(val)}</b><span>de ${fmt(goal)} kcal</span></div></div>`;
}
function macroBar(label,val,goal,col){
  const pct=Math.min(100, goal? val/goal*100:0);
  return `<div class="macro"><div class="ml"><span>${label}</span><b>${fmt(val)} / ${fmt(goal)} g</b></div>
    <div class="bar"><i style="width:${pct}%;background:${col}"></i></div></div>`;
}

        <li>Para vos (~65 kg, 43, activo): rondás <b>~2.200-2.300 kcal</b> de mantenimiento.</li>
        <li><b>Perder grasa</b>: −500 kcal/día ≈ −0,45 kg/semana.</li>
        <li><b>Ganar músculo</b>: +500 kcal/día ≈ +0,45 kg/semana (un excedente chico alcanza).</li>
        <li>El metabolismo se adapta: reajustá según la <b>tendencia</b> de tu peso, no el día a día.</li>
      </ul>
    </div>

    <div class="card"><h3>🥩 Nutrición · Macros</h3>
      <ul class="tips">
        <li><b>Proteína</b>: ~1,6-2,2 g por kg de peso (más en déficit, menos en volumen). Para vos: ~110-145 g/día. Apuntá al medio del rango y listo.</li>
        <li><b>Grasas</b>: 20-35% de las calorías (~50-75 g). Importan para las hormonas.</li>
        <li><b>Carbohidratos</b>: lo que queda. Son tu combustible de entrenamiento; sumá fibra (verduras, fruta, integrales) para saciedad.</li>
        <li>Repartí en <b>3-5 comidas</b>; lo que más pesa es el total del día, no el horario.</li>
      </ul>
    </div>

    <div class="card"><h3>♻️ Recomposición</h3>
      <p style="margin:0">Ganar músculo y perder grasa a la vez es más fácil en principiantes, en quienes vuelven tras un parate, con un buen plan por primera vez, o con bastante grasa para perder. Como intermedio, tu ventana es más chica: la jugada es comer <b>cerca del mantenimiento</b>, con <b>proteína alta</b> y entrenamiento que progresa. Si querés foco, mejor un objetivo por vez.</p>
    </div>

    <div class="card"><h3>🏃 Cardio</h3>
      <p style="margin:0 0 10px">Ni obligatorio ni prohibido. Cuanto más activo seas fuera del gym, menos lo necesitás.</p>
      <ul class="tips">
        <li>Calentás en cinta/bici: máximo 10 min. El cardio largo, después de pesas o en días libres.</li>
        <li>LISS (suave continuo) y HIIT queman grasa parecido por caloría; el HIIT, 1-2 veces/semana y ≤30 min.</li>
        <li>Ojo con el impacto alto (correr, fútbol): puede interferir en la recuperación de piernas y sentadilla. Tu fútbol 2× ya es tu cardio: no hace falta más.</li>
      </ul>
    </div>

    <div class="card"><h3>😴 Recuperación</h3>
      <ul class="tips">
        <li><b>Dormir</b> bien es el factor de recuperación número uno.</li>
        <li>Comé <b>suficientes calorías y proteína</b>: los cortes muy agresivos arruinan la recuperación.</li>
        <li>Dejá descanso entre sesiones; lo pesado y complejo (sentadilla, peso muerto) pide más.</li>
      </ul>
    </div>

    <div class="card"><h3>📐 Medir el progreso</h3>
      <ul class="tips">
        <li>Mirá <b>tendencias</b>, no el ruido diario: promedio semanal del peso.</li>
        <li>Sumá <b>medida de cintura</b>, <b>fotos</b> y tu <b>registro de fuerza</b>.</li>
        <li>La app ya te grafica peso, medidas y 1RM estimado: usalos juntos.</li>
      </ul>
    </div>

    <div class="card"><h3>🩹 Lesiones y molestias</h3>
      <ul class="tips">
        <li>Entrená <b>alrededor</b> del dolor: bajá carga o rango, no empujes a través de un dolor agudo.</li>
        <li>La mayoría se resuelve con <b>paciencia</b> y manejo de la carga.</li>
        <li>Si persiste, consultá a un profesional.</li>
      </ul>
    </div>

    <div class="card"><h3>🧪 Suplementos que valen la pena</h3>
      <ul class="tips">
        <li><b>Proteína en polvo</b>: la forma cómoda de llegar a tu objetivo diario.</li>
        <li><b>Creatina monohidrato</b>: 3-5 g por día, siempre. La más probada y segura.</li>
        <li><b>Cafeína</b>: poca, antes de entrenar, ayuda al rendimiento.</li>
        <li>Aceite de pescado y multivitamínico: opcionales, como "seguro" si tu dieta es acotada.</li>
      </ul>
    </div>

    <div class="card"><h3>🌱 Sostenibilidad</h3>
      <p style="margin:0">La constancia gana. Que el plan sea disfrutable, seguro y bien dosificado importa más que cualquier "rutina perfecta". Con 3 días de gimnasio + 2 de fútbol alcanza y sobra, si lo sostenés en el tiempo.</p>
    </div>
  `;
  window.scrollTo(0,0);
}

function saveProfile(){
  S.profile={ name:$('#pName').value, heightCm:+$('#pH').value, age:+$('#pAge').value, sex:$('#pSex').value,

function autoMacros(){
  const h=+$('#pH').value, age=+$('#pAge').value, sex=$('#pSex').value;
  const bw=latestBW(); const w=bw?bw.kg:(+$('#pGW').value||75);
  let bmr= 10*w + 6.25*h - 5*age + (sex==='h'?5:-161);
  let tdee= Math.round(bmr*1.55);
  const cal=tdee;
  const prot=Math.round(w*2.0), fat=Math.round(w*0.9), carb=Math.round((cal-prot*4-fat*9)/4);
  $('#pCal').value=cal; $('#pProt').value=prot; $('#pCarb').value=Math.max(0,carb); $('#pFat').value=fat;
  flash('Objetivos calculados 🧮');
}

/* ============================ SINCRONIZACIÓN (Firebase) ============================ */
let syncRef=null, myRev=null;
const SYNC_CFG_KEY='fitmauro_sync';
function getSyncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_CFG_KEY))||{}; }catch(e){ return {}; } }
function saveSyncCfg(o){ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(o)); }
function setSyncStatus(txt,cls){ const el=document.getElementById('syncStatus'); if(el){ el.textContent=txt; el.className='syncpill '+(cls||''); } }
function parseCfg(raw){ if(raw && typeof raw==='object') return raw; raw=String(raw||'').trim(); const m=raw.match(/\{[\s\S]*\}/); if(m) raw=m[0]; try{ return JSON.parse(raw); }catch(e){} try{ return (new Function('return ('+raw+')'))(); }catch(e){} return null; }
function normState(s){
  const base=JSON.parse(JSON.stringify(DEFAULT_STATE));
  const o=Object.assign(base, s||{});
  ['workouts','bodyweight','measurements','nutrition','deletedIds'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
  if(!o.routine||typeof o.routine!=='object') o.routine=JSON.parse(JSON.stringify(DEFAULT_ROUTINE));
  if(!o.profile) o.profile=base.profile;
  return o;
}
function mergeWk(a,b){
  const m={};
  const filled=w=>(w.exercises||[]).reduce((x,e)=>x+(e.sets||[]).filter(s=>s.r!==''&&s.r!=null).length,0);
  const put=w=>{ if(!w||w.id==null) return; const cur=m[w.id]; if(!cur){ m[w.id]=w; return; } const tc=+cur._m||0, tw=+w._m||0; if(tw>tc || (tw===tc && filled(w)>filled(cur))) m[w.id]=w; };
  (a||[]).forEach(put); (b||[]).forEach(put); return Object.values(m);
}
function mergeState(localS, remote){
  const out=normState(localS); remote=remote||{};
  const uni=(a,b,key)=>{ const m={}; (a||[]).forEach(x=>{ if(x&&x[key]!=null) m[x[key]]=x; }); (b||[]).forEach(x=>{ if(x&&x[key]!=null&&!(x[key] in m)) m[x[key]]=x; }); return Object.values(m); };
  out.workouts=mergeWk(out.workouts, remote.workouts);
  const _tomb=new Set([...((localS&&localS.deletedIds)||[]), ...((remote&&remote.deletedIds)||[])]);
  out.deletedIds=[..._tomb];
  if(_tomb.size){ out.workouts=out.workouts.filter(w=>!_tomb.has(w.id)); }
  out.nutrition=uni(out.nutrition, remote.nutrition, 'id');
  out.bodyweight=uni(out.bodyweight, remote.bodyweight, 'date');
  out.measurements=uni(out.measurements, remote.measurements, 'date');
  if((remote._ts||0) > (localS._ts||0)){
    if(remote.profile) out.profile=remote.profile;
    if(remote.routine) out.routine=remote.routine;
    if(remote.programStart) out.programStart=remote.programStart;
    if(remote.deloadWeeks) out.deloadWeeks=remote.deloadWeeks;
  }
  return out;
}
function applyMerged(s){
  S=normState(s);
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  renderHeader(); setView(currentView); setSyncStatus('Sincronizado ✓','ok');
}
function connectSync(cfgRaw, code, fromUI){
  if(typeof firebase==='undefined'){ setSyncStatus('Sin conexión','err'); if(fromUI) alert('No se pudo cargar Firebase. Revisá tu conexión a internet.'); return; }
  const config=parseCfg(cfgRaw);
  if(!config){ if(fromUI) alert('La configuración de Firebase no es válida. Pegá el objeto que te da la consola (firebaseConfig).'); return; }
  if(!config.databaseURL){ if(fromUI) alert('Falta "databaseURL". Activá Realtime Database en Firebase y copiá el config de nuevo.'); return; }
  code=String(code||'').trim();
  if(!code){ if(fromUI) alert('Escribí un código de sincronización (el mismo en todos tus dispositivos).'); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    saveSyncCfg({config, code});
    setSyncStatus('Conectando…','wait');
    const proceed=()=>{
    if(syncRef) return;
    const db=firebase.database();
    syncRef=db.ref('fitmauro/'+code.replace(/[.#$\[\]/]/g,'_'));
    syncRef.once('value').then(snap=>{
      const v=snap.val();
      const merged=mergeState(S, v||{});
      S=normState(merged); S._ts=Date.now(); myRev=S._rev=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      localStorage.setItem(LS_KEY, JSON.stringify(S)); try{ syncRef.set(S); }catch(e){}
      renderHeader(); setView(currentView); setSyncStatus('Sincronizado ✓','ok');
      syncRef.on('value', snap2=>{ const d=snap2.val(); if(!d||!d.profile) return; if(d._rev && d._rev===myRev) return; S=mergeState(S,d); localStorage.setItem(LS_KEY, JSON.stringify(S)); renderHeader(); setView(currentView); setSyncStatus('Sincronizado ✓','ok'); });
      if(fromUI) flash('Sincronización activada ☁️');
    }).catch(e=>{ setSyncStatus('Error de conexión','err'); if(fromUI) alert('Error al conectar: '+e.message+'\nRevisá las reglas de Realtime Database.'); });
    };
    if(firebase.auth){
      const auth=firebase.auth();
      if(auth.currentUser){ proceed(); }
      else {
        if(!window.__authHook){ window.__authHook=true; auth.onAuthStateChanged(u=>{ if(u) proceed(); }); }
        auth.signInAnonymously().catch(e=>{ proceed(); if(fromUI) setTimeout(function(){ alert('Nota: para proteger tus datos, activá el proveedor "Anónimo" en Firebase → Authentication → Sign-in method.\n\n'+e.message); },100); });
        setTimeout(proceed, 4000);
      }
    } else { proceed(); }
  }catch(e){ setSyncStatus('Error','err'); if(fromUI) alert('Error: '+e.message); }
}
function disconnectSync(){ if(syncRef){ try{ syncRef.off(); }catch(e){} syncRef=null; } localStorage.removeItem(SYNC_CFG_KEY); setSyncStatus('Desconectado',''); flash('Sincronización desactivada'); }
function exportSyncLink(){ const sc=getSyncCfg(); if(!sc.config){ alert('Primero conectá la sincronización en este dispositivo.'); return; } const blob=btoa(unescape(encodeURIComponent(JSON.stringify(sc)))); showModal(`<div class="mhead"><h3>Código de sync</h3><button class="x" onclick="closeModal()">✕</button></div><p class="sub">Copiá este código y, en el otro dispositivo, entrá a Ajustes → Sincronización → "Pegar código". Conecta todo automáticamente.</p><textarea id="synkBlob" style="height:130px" readonly>${blob}</textarea><button class="btn full" style="margin-top:10px" onclick="(navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('synkBlob').value)); flash('Copiado ✓')">📋 Copiar</button>`); }
function importSyncLink(){ const blob=prompt('Pegá aquí el código de sync del otro dispositivo:'); if(!blob) return; try{ const sc=JSON.parse(decodeURIComponent(escape(atob(blob.trim())))); connectSync(sc.config, sc.code, true); }catch(e){ alert('El código no es válido.'); } }
